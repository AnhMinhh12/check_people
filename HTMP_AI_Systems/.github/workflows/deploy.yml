name: Deploy AI System (Linux)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update and Restart Containers
        run: |
          docker compose pull
          docker compose up -d --build
          docker image prune -f